<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" style="stop-color:#09090F"/>
      <stop offset="100%" style="stop-color:#0F0D18"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BFA054;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7A5E28;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4B668;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#BFA054;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8A6F2E;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#D4B668;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="blue1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E2E52;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0A1428;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="blue2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#2A3D6B;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0A1428;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="warm" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#C8933A;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#BFA054;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="orb1" cx="38%" cy="38%" r="45%">
      <stop offset="0%" style="stop-color:#BFA054;stop-opacity:0.22"/>
      <stop offset="50%" style="stop-color:#BFA054;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#BFA054;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="68%" cy="62%" r="40%">
      <stop offset="0%" style="stop-color:#1E3060;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#1E3060;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="20%" cy="78%" r="35%">
      <stop offset="0%" style="stop-color:#BFA054;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#BFA054;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="fine" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <clipPath id="frame">
      <rect width="800" height="1000"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background -->
    <rect width="800" height="1000" fill="url(#bg)"/>

    <!-- Deep ambient orbs -->
    <ellipse cx="310" cy="380" rx="420" ry="380" fill="url(#orb1)" filter="url(#bloom)"/>
    <ellipse cx="560" cy="640" rx="340" ry="310" fill="url(#orb2)" filter="url(#bloom)"/>
    <ellipse cx="160" cy="780" rx="280" ry="240" fill="url(#orb3)" filter="url(#bloom)"/>

    <!-- Large tilted color planes -->
    <polygon points="-80,200 460,-60 520,180 -20,440" fill="url(#g1)" opacity="0.09"/>
    <polygon points="-80,200 460,-60 520,180 -20,440" fill="none" stroke="#BFA054" stroke-width="0.8" opacity="0.2"/>

    <polygon points="340,1080 860,600 900,820 380,1100" fill="url(#g3)" opacity="0.08"/>
    <polygon points="340,1080 860,600 900,820 380,1100" fill="none" stroke="#BFA054" stroke-width="0.8" opacity="0.18"/>

    <polygon points="700,-80 980,300 800,420 520,40" fill="url(#blue1)" opacity="0.12"/>
    <polygon points="700,-80 980,300 800,420 520,40" fill="none" stroke="#3A5490" stroke-width="0.8" opacity="0.18"/>

    <polygon points="-100,700 200,1100 -60,1100" fill="url(#blue2)" opacity="0.1"/>
    <polygon points="600,0 840,0 840,340" fill="url(#warm)" opacity="0.08"/>

    <!-- Medium tilted rectangles -->
    <rect x="60" y="160" width="280" height="180" rx="2" fill="none" stroke="#BFA054" stroke-width="1.2" opacity="0.22" transform="rotate(-14 200 250)"/>
    <rect x="70" y="170" width="260" height="160" rx="2" fill="#BFA054" opacity="0.025" transform="rotate(-14 200 250)"/>

    <rect x="460" y="300" width="220" height="320" rx="2" fill="none" stroke="#BFA054" stroke-width="1" opacity="0.18" transform="rotate(8 570 460)"/>
    <rect x="470" y="310" width="200" height="300" rx="2" fill="#BFA054" opacity="0.02" transform="rotate(8 570 460)"/>

    <rect x="120" y="580" width="300" height="200" rx="2" fill="none" stroke="#3A5490" stroke-width="1" opacity="0.2" transform="rotate(-6 270 680)"/>

    <rect x="500" y="680" width="200" height="260" rx="2" fill="none" stroke="#BFA054" stroke-width="1" opacity="0.16" transform="rotate(11 600 810)"/>

    <rect x="280" y="80" width="180" height="140" rx="2" fill="none" stroke="#D4B668" stroke-width="0.8" opacity="0.2" transform="rotate(3 370 150)"/>

    <rect x="600" y="820" width="240" height="160" rx="2" fill="none" stroke="#BFA054" stroke-width="1" opacity="0.15" transform="rotate(-9 720 900)"/>

    <!-- Overlapping smaller rectangles — layered depth -->
    <rect x="180" y="300" width="110" height="75" rx="1" fill="#BFA054" opacity="0.07" transform="rotate(-18 235 337)"/>
    <rect x="180" y="300" width="110" height="75" rx="1" fill="none" stroke="#BFA054" stroke-width="0.8" opacity="0.3" transform="rotate(-18 235 337)"/>

    <rect x="520" y="160" width="130" height="90" rx="1" fill="#BFA054" opacity="0.05" transform="rotate(22 585 205)"/>
    <rect x="520" y="160" width="130" height="90" rx="1" fill="none" stroke="#D4B668" stroke-width="0.8" opacity="0.25" transform="rotate(22 585 205)"/>

    <rect x="300" y="700" width="120" height="80" rx="1" fill="#2A3D6B" opacity="0.15" transform="rotate(-8 360 740)"/>
    <rect x="300" y="700" width="120" height="80" rx="1" fill="none" stroke="#3A5490" stroke-width="0.8" opacity="0.25" transform="rotate(-8 360 740)"/>

    <rect x="80" y="440" width="90" height="60" rx="1" fill="#BFA054" opacity="0.06" transform="rotate(12 125 470)"/>
    <rect x="80" y="440" width="90" height="60" rx="1" fill="none" stroke="#BFA054" stroke-width="0.7" opacity="0.25" transform="rotate(12 125 470)"/>

    <rect x="640" y="450" width="100" height="70" rx="1" fill="#BFA054" opacity="0.05" transform="rotate(-16 690 485)"/>
    <rect x="640" y="450" width="100" height="70" rx="1" fill="none" stroke="#BFA054" stroke-width="0.7" opacity="0.22" transform="rotate(-16 690 485)"/>

    <!-- Long sweeping curves — gestural -->
    <path d="M -40 900 C 100 700 280 580 480 440 S 700 260 820 60" fill="none" stroke="#BFA054" stroke-width="1.8" opacity="0.28" stroke-linecap="round"/>
    <path d="M -40 900 C 100 700 280 580 480 440 S 700 260 820 60" fill="none" stroke="#BFA054" stroke-width="22" opacity="0.04" stroke-linecap="round" filter="url(#glow)"/>

    <path d="M -60 640 C 120 520 340 600 500 520 S 720 380 860 300" fill="none" stroke="#D4B668" stroke-width="1.2" opacity="0.2" stroke-linecap="round"/>

    <path d="M 860 800 C 680 680 500 720 320 640 S 80 480 -40 360" fill="none" stroke="#BFA054" stroke-width="1" opacity="0.16" stroke-linecap="round"/>

    <path d="M 100 -40 C 180 160 140 380 200 540 S 260 760 180 980" fill="none" stroke="#BFA054" stroke-width="1.2" opacity="0.18" stroke-linecap="round"/>
    <path d="M 680 -40 C 620 180 700 360 660 520 S 580 740 640 980" fill="none" stroke="#BFA054" stroke-width="1" opacity="0.14" stroke-linecap="round"/>

    <path d="M -40 200 C 140 280 300 220 460 300 S 680 420 840 380" fill="none" stroke="#3A5490" stroke-width="1" opacity="0.2" stroke-linecap="round"/>

    <!-- Short gestural strokes -->
    <path d="M 220 140 Q 280 110 330 145" fill="none" stroke="#BFA054" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>
    <path d="M 230 155 Q 270 135 310 158" fill="none" stroke="#BFA054" stroke-width="0.8" opacity="0.2" stroke-linecap="round"/>

    <path d="M 540 820 Q 600 795 645 825" fill="none" stroke="#BFA054" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
    <path d="M 548 835 Q 592 815 632 838" fill="none" stroke="#BFA054" stroke-width="0.8" opacity="0.18" stroke-linecap="round"/>

    <path d="M 680 560 Q 730 535 770 560" fill="none" stroke="#D4B668" stroke-width="1.2" opacity="0.28" stroke-linecap="round"/>
    <path d="M 50 380 Q 90 360 125 382" fill="none" stroke="#BFA054" stroke-width="1.2" opacity="0.3" stroke-linecap="round"/>

    <!-- Thin parallel line clusters -->
    <line x1="30" y1="70" x2="200" y2="70" stroke="#BFA054" stroke-width="0.7" opacity="0.25"/>
    <line x1="30" y1="78" x2="160" y2="78" stroke="#BFA054" stroke-width="0.7" opacity="0.16"/>
    <line x1="30" y1="86" x2="110" y2="86" stroke="#BFA054" stroke-width="0.7" opacity="0.1"/>

    <line x1="600" y1="940" x2="780" y2="940" stroke="#BFA054" stroke-width="0.7" opacity="0.22"/>
    <line x1="630" y1="948" x2="780" y2="948" stroke="#BFA054" stroke-width="0.7" opacity="0.14"/>
    <line x1="660" y1="956" x2="780" y2="956" stroke="#BFA054" stroke-width="0.7" opacity="0.09"/>

    <line x1="420" y1="50" x2="560" y2="50" stroke="#BFA054" stroke-width="0.6" opacity="0.2"/>
    <line x1="440" y1="58" x2="560" y2="58" stroke="#BFA054" stroke-width="0.6" opacity="0.12"/>

    <line x1="660" y1="380" x2="780" y2="380" stroke="#3A5490" stroke-width="0.7" opacity="0.22"/>
    <line x1="680" y1="388" x2="780" y2="388" stroke="#3A5490" stroke-width="0.7" opacity="0.14"/>

    <!-- Scattered fine dots — ink splatter feel -->
    <circle cx="390" cy="210" r="2.2" fill="#BFA054" opacity="0.45"/>
    <circle cx="405" cy="222" r="1.4" fill="#BFA054" opacity="0.3"/>
    <circle cx="375" cy="226" r="1" fill="#BFA054" opacity="0.25"/>
    <circle cx="415" cy="205" r="0.8" fill="#BFA054" opacity="0.2"/>
    <circle cx="382" cy="215" r="0.6" fill="#BFA054" opacity="0.18"/>

    <circle cx="200" cy="620" r="2" fill="#BFA054" opacity="0.38"/>
    <circle cx="214" cy="632" r="1.2" fill="#BFA054" opacity="0.25"/>
    <circle cx="190" cy="634" r="0.9" fill="#BFA054" opacity="0.2"/>

    <circle cx="620" cy="320" r="1.8" fill="#D4B668" opacity="0.4"/>
    <circle cx="632" cy="330" r="1.1" fill="#D4B668" opacity="0.25"/>
    <circle cx="610" cy="334" r="0.8" fill="#D4B668" opacity="0.18"/>

    <circle cx="140" cy="880" r="1.8" fill="#BFA054" opacity="0.32"/>
    <circle cx="153" cy="890" r="1.1" fill="#BFA054" opacity="0.2"/>

    <circle cx="700" cy="140" r="1.6" fill="#BFA054" opacity="0.35"/>
    <circle cx="712" cy="150" r="1" fill="#BFA054" opacity="0.22"/>

    <!-- Small geometric accents — not symbolic, just decorative -->
    <rect x="358" y="480" width="18" height="18" fill="none" stroke="#BFA054" stroke-width="0.8" opacity="0.3" transform="rotate(20 367 489)"/>
    <rect x="360" y="482" width="14" height="14" fill="#BFA054" opacity="0.06" transform="rotate(20 367 489)"/>

    <rect x="130" y="720" width="16" height="16" fill="none" stroke="#3A5490" stroke-width="0.8" opacity="0.28" transform="rotate(-15 138 728)"/>

    <rect x="680" y="240" width="20" height="20" fill="none" stroke="#BFA054" stroke-width="0.8" opacity="0.26" transform="rotate(33 690 250)"/>
    <rect x="682" y="242" width="16" height="16" fill="#BFA054" opacity="0.04" transform="rotate(33 690 250)"/>

    <rect x="50" y="540" width="14" height="14" fill="none" stroke="#BFA054" stroke-width="0.7" opacity="0.24" transform="rotate(-28 57 547)"/>

    <!-- Color band washes — Rothko influence, non-symbolic -->
    <rect x="0" y="340" width="800" height="80" fill="#BFA054" opacity="0.018"/>
    <rect x="0" y="580" width="800" height="60" fill="#1E2E52" opacity="0.04"/>
    <rect x="0" y="0" width="800" height="120" fill="#BFA054" opacity="0.015"/>
    <rect x="0" y="880" width="800" height="120" fill="#BFA054" opacity="0.015"/>

    <!-- Glow edge vignette -->
    <rect width="800" height="1000" fill="url(#bg)" opacity="0.22"/>
  </g>
</svg>
